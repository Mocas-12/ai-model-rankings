name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC：线上接口 shape 冒烟
    - cron: '0 5 * * *'   # 每日 05:00 UTC：成本快照（降价榜数据源）

jobs:
  smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Verify Streamlit inline rewrites
        run: python3 tests/test_inline.py
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Lighthouse baseline (non-blocking)
        continue-on-error: true
        run: |
          node tests/static-server.mjs &
          sleep 1
          npx --yes lighthouse@12 http://localhost:8938 --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=lighthouse.json --port=0 --quiet \
            --chrome-flags="--headless=new"
          node -e "
            const r = require('./lighthouse.json');
            const line = Object.entries(r.categories).map(([k, v]) => k + ' ' + Math.round(v.score * 100)).join(' · ');
            console.log('Lighthouse (desktop):', line);
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Lighthouse (desktop)\n\n' + line + '\n');
          "
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-json
          path: lighthouse.json
          retention-days: 30
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  live-api:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live

  snapshot:
    if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/snapshot.py
      - run: |
          git config user.name "mubang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "data: 每日成本快照 [skip ci]"
          git push
